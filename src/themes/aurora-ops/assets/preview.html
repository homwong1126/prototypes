<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurora Ops Preview</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #0b1020; }
      body { display: grid; place-items: center; color: #e8edf6; font-family: Inter, system-ui, sans-serif; }
      .wrap { width: min(960px, calc(100vw - 48px)); padding: 32px; background: #11182b; border: 1px solid #28324a; border-radius: 16px; }
      .eyebrow { color: #7f8aa3; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 12px; }
      h1 { margin: 0 0 12px; font-size: 32px; line-height: 1.1; }
      p { margin: 0; color: #b7c2d6; line-height: 1.6; }
      .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
      .chip { padding: 8px 12px; border-radius: 9999px; background: #16203a; border: 1px solid #38445f; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="eyebrow">Aurora Ops</div>
      <h1>High-density operations, calm and precise.</h1>
      <p>Cool graphite surfaces, a single blue primary, and compact geometry for service workbenches, dispatch boards, and enterprise tables.</p>
      <div class="chips">
        <div class="chip">Workflow</div>
        <div class="chip">Tables</div>
        <div class="chip">Forms</div>
        <div class="chip">Status</div>
      </div>
    </div>
  </body>
</html>
