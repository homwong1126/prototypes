<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="940" viewBox="0 0 1600 940">
  <defs>
    <style>
      .system { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .database { fill: #c8e6c9; stroke: #388e3c; stroke-width: 2; }
      .external { fill: #fff9c4; stroke: #f57c00; stroke-width: 2; }
      .finance { fill: #ffccbc; stroke: #d84315; stroke-width: 2; }
      .mapping { fill: #fce4ec; stroke: #ad1457; stroke-width: 2; }
      .text { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; fill: #333; text-anchor: middle; }
      .text-small { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #666; text-anchor: middle; }
      .arrow { fill: none; stroke: #666; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666" />
    </marker>
  </defs>

  <text x="800" y="40" class="text" style="font-size: 20px; font-weight: 600;">限价管理数据流图</text>
  <text x="800" y="60" class="text-small" style="fill: #999; font-size: 11px;">V1.2 · 含门店-大区映射与条线审批人路由</text>

  <rect x="610" y="360" width="380" height="120" rx="12" class="system" />
  <text x="800" y="400" class="text" style="font-size: 16px; font-weight: 600;">限价管理平台</text>
  <text x="800" y="422" class="text-small">核心业务处理</text>
  <text x="800" y="442" class="text-small" style="font-size: 11px;">车辆性质判定 | 规则匹配 | 降幅计算 | 审批流转</text>
  <text x="800" y="462" class="text-small" style="font-size: 10px; fill: #ad1457;">大区按门店所属大区过滤 · 条线按品牌+产品序列路由</text>

  <ellipse cx="270" cy="160" rx="110" ry="62" class="database" />
  <text x="270" y="154" class="text" style="font-weight: 600;">库存管理系统</text>
  <text x="270" y="174" class="text-small">车辆定义字段</text>
  <text x="270" y="192" class="text-small" style="font-size: 11px;">性质类型 / 版型 / 车型</text>

  <rect x="1220" y="110" width="220" height="110" rx="10" class="external" />
  <text x="1330" y="150" class="text" style="font-weight: 600;">销售/订单系统</text>
  <text x="1330" y="170" class="text-small">订单配车保存</text>
  <text x="1330" y="188" class="text-small" style="font-size: 11px;">预估综合毛利</text>

  <rect x="1020" y="250" width="200" height="95" rx="10" class="external" />
  <text x="1120" y="288" class="text" style="font-weight: 600;">新车开票流程</text>
  <text x="1120" y="308" class="text-small">读取已通过状态</text>
  <text x="1120" y="324" class="text-small" style="font-size: 10px;">仅已通过可放行</text>

  <rect x="50" y="600" width="220" height="110" rx="10" class="finance" />
  <text x="160" y="640" class="text" style="font-weight: 600;">限价规则表</text>
  <text x="160" y="660" class="text-small">车型/版型/年款/月款</text>
  <text x="160" y="678" class="text-small" style="font-size: 11px;">综合毛利限价 | 审批额度</text>

  <rect x="340" y="600" width="240" height="110" rx="10" class="mapping" />
  <text x="460" y="636" class="text" style="font-weight: 600; fill: #880e4f;">门店-大区映射表</text>
  <text x="460" y="656" class="text-small">ERP号 → 所属大区 / 大区总</text>
  <text x="460" y="674" class="text-small" style="font-size: 11px; fill: #ad1457;">例：3059郑州盈丰 → 河南一区·王芬</text>
  <text x="460" y="692" class="text-small" style="font-size: 10px;">大区审核单据过滤来源</text>

  <rect x="640" y="600" width="240" height="110" rx="10" class="mapping" />
  <text x="760" y="636" class="text" style="font-weight: 600; fill: #880e4f;">条线审批人配置表</text>
  <text x="760" y="656" class="text-small">品牌+产品序列 → 销售支持</text>
  <text x="760" y="674" class="text-small" style="font-size: 11px; fill: #ad1457;">C/H网·刘邓淅 | E/R网·章登廷</text>
  <text x="760" y="692" class="text-small" style="font-size: 10px;">Q网·马兆初 | 捷途/星途·周彬 | iCAR·陈核锋</text>

  <rect x="1230" y="600" width="220" height="100" rx="10" class="finance" />
  <text x="1340" y="635" class="text" style="font-weight: 600;">审核人员</text>
  <text x="1340" y="655" class="text-small">大区 / 条线 / 门店 / 集团</text>
  <text x="1340" y="673" class="text-small" style="font-size: 11px;">通过 / 驳回（逐级退回）</text>

  <rect x="90" y="330" width="210" height="90" rx="10" class="database" />
  <text x="195" y="366" class="text" style="font-weight: 600; font-size: 13px;">无匹配规则场景</text>
  <text x="195" y="386" class="text-small">版型无规则</text>
  <text x="195" y="404" class="text-small" style="font-size: 11px;">默认不生成申请单</text>

  <rect x="1210" y="360" width="240" height="110" rx="10" class="system" />
  <text x="1330" y="400" class="text" style="font-weight: 600;">限价申请单</text>
  <text x="1330" y="420" class="text-small">待审核 / 已通过 / 已驳回</text>
  <text x="1330" y="438" class="text-small" style="font-size: 11px;">同车仅一条有效单</text>
  <text x="1330" y="454" class="text-small" style="font-size: 10px; fill: #ad1457;">带出所属大区/大区总/条线审批人</text>

  <path d="M 380 185 Q 500 260 615 375" class="arrow" />
  <text x="500" y="270" class="text-small" style="fill: #1976d2;">查询车辆定义字段</text>
  <text x="500" y="285" class="text-small" style="font-size: 10px; fill: #666;">常规车/非常规车</text>

  <path d="M 615 390 Q 500 315 300 380" class="arrow" stroke-dasharray="4,4" />
  <text x="470" y="332" class="text-small" style="font-size: 10px; fill: #999;">返回性质结果</text>

  <path d="M 610 420 Q 460 530 270 600" class="arrow" />
  <text x="460" y="520" class="text-small" style="fill: #d84315;">查询限价规则</text>
  <text x="460" y="536" class="text-small" style="font-size: 10px; fill: #666;">车型/版型/年款/月款</text>

  <path d="M 270 640 Q 430 600 610 460" class="arrow" stroke-dasharray="4,4" />
  <text x="430" y="590" class="text-small" style="font-size: 10px; fill: #999;">返回规则与额度</text>

  <!-- 新增：映射表流入 -->
  <path d="M 460 600 Q 580 520 640 420" class="arrow" />
  <text x="580" y="508" class="text-small" style="fill: #ad1457; font-size: 11px;">带出所属大区/大区总</text>
  <text x="580" y="522" class="text-small" style="font-size: 10px; fill: #666;">ERP号匹配映射</text>

  <path d="M 760 600 Q 760 520 780 470" class="arrow" />
  <text x="810" y="540" class="text-small" style="fill: #ad1457; font-size: 11px;">带出条线审批人</text>
  <text x="810" y="554" class="text-small" style="font-size: 10px; fill: #666;">品牌+产品序列匹配</text>

  <path d="M 980 385 Q 1120 375 1210 400" class="arrow" />
  <text x="1090" y="368" class="text-small" style="fill: #1976d2;">创建申请单</text>
  <text x="1090" y="383" class="text-small" style="font-size: 10px; fill: #666;">触发审批流转</text>

  <path d="M 980 432 Q 1120 505 1230 630" class="arrow" />
  <text x="1120" y="515" class="text-small" style="fill: #d84315;">流转至审核人员</text>
  <text x="1120" y="531" class="text-small" style="font-size: 10px; fill: #666;">按大区过滤/按条线路由</text>

  <path d="M 1330 360 Q 1330 270 1230 320" class="arrow" />
  <text x="1395" y="300" class="text-small" style="fill: #f57c00;">开票放行检查</text>
  <text x="1395" y="316" class="text-small" style="font-size: 10px; fill: #666;">仅已通过可继续</text>

  <path d="M 1050 300 Q 950 250 830 360" class="arrow" />
  <text x="920" y="255" class="text-small" style="fill: #1976d2;">读取申请状态</text>

  <path d="M 195 420 Q 360 500 610 410" class="arrow" />
  <text x="400" y="476" class="text-small" style="fill: #388e3c;">无匹配则不生成</text>
  <text x="400" y="491" class="text-small" style="font-size: 10px; fill: #666;">默认无需限价审批</text>

  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="210" height="90" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1" />
    <text x="105" y="20" class="text-small" style="font-weight: 600;">数据流说明</text>
    <text x="105" y="40" class="text-small" style="font-size: 11px;">实线箭头：请求 / 创建 / 流转</text>
    <text x="105" y="56" class="text-small" style="font-size: 11px;">虚线箭头：返回 / 回写 / 放行</text>
    <text x="105" y="72" class="text-small" style="font-size: 11px;">粉色：V1.2 新增映射/路由</text>
  </g>

  <g transform="translate(980, 770)">
    <rect x="0" y="0" width="560" height="130" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2" />
    <text x="280" y="20" class="text-small" style="font-weight: 600; fill: #e65100;">核心业务规则（V1.2 更新）</text>
    <text x="16" y="42" class="text-small" style="font-size: 11px; text-anchor: start;">1. 通过库存车辆定义字段判定车辆性质：常规车 / 非常规车。</text>
    <text x="16" y="60" class="text-small" style="font-size: 11px; text-anchor: start;">2. 按车型/版型匹配限价规则表，获取综合毛利限价与审批额度。</text>
    <text x="16" y="78" class="text-small" style="font-size: 11px; text-anchor: start;">3. 版型无匹配时不生成申请单，默认无需限价审批。</text>
    <text x="16" y="96" class="text-small" style="font-size: 11px; text-anchor: start; fill: #ad1457;">4. 生成申请单时按ERP号带出所属大区/大区总，按品牌+产品序列带出条线审批人。</text>
    <text x="16" y="114" class="text-small" style="font-size: 11px; text-anchor: start;">5. 限价流程必须已通过后，新车开票方可继续。</text>
  </g>
</svg>
